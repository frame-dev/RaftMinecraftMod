license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
An original ocean survival mod with moving rafts, exploration, and progression.
Build an ocean home with moving stations, survival machines, sailing,
cooperative exploration, trading and an open-ended original story.
'''

[[mixins]]
config="raft_ocean.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},26.4)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
